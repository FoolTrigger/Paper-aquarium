  if (DEMO) {
    // «Мои аквариумы» тоже прячем: он вёл туда же, куда «Завести свой».
    ['m-capture', 'm-pack', 'm-print', 'm-bg', 'm-fish', 'm-share', 'm-home']
      .forEach(function (id) { document.getElementById(id).hidden = true; });
    document.getElementById('m-demo').hidden = false;
    document.getElementById('m-own').hidden = false;
    document.getElementById('m-key').hidden = true;
    var ren = document.getElementById('m-rename');
    ren.disabled = true;
    ren.querySelector('.pen').hidden = true;
  }

  var serverNetworkBase = null;
  fetch('/api/network').then(function (r) { return r.json(); }).then(function (info) {
    if (info && info.preferredUrl) {
      serverNetworkBase = info.preferredUrl;
      var qrBox = document.getElementById('share-qr');
      if (qrBox && qrBox.firstChild && (location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
        drawQr(qrBox, tankLink(), true);
        var urlEl = document.getElementById('share-url');
        if (urlEl) urlEl.textContent = tankLink();
      }
    }
  }).catch(function () {});

  // Ссылку отдаём целиком: по коду аквариум открывают на другом устройстве.
  // Если страница открыта на ПК (localhost), для QR-кода и шаринга подставляем LAN IP.
  function tankLink() {
    var base = (location.hostname !== 'localhost' && location.hostname !== '127.0.0.1')
      ? location.origin
      : (serverNetworkBase || location.origin);
    return base + Tank.url;
  }

  function copyLink(done) {
    // Буфера может не быть вовсе: с телефона аквариум открывают по http,
    // а там браузер эту возможность не даёт. Тогда показываем ссылку
    // выделенной — скопировать вручную всё равно можно.
    var link = tankLink();
    var manual = function () {
      Modal.prompt({
        title: I18N.t('menu.link.title'),
        text: I18N.t('menu.link.text'),
        value: link, mono: true, confirmLabel: I18N.t('menu.link.ok')
      });
    };
    if (navigator.clipboard) navigator.clipboard.writeText(link).then(done, manual);
    else manual();
  }

  // QR рисует вендорная библиотека, сразу в SVG — он резкий на любом экране.
  // Белую подложку даёт .qrbox: без неё сканер кода на тёмном не видит.
  function drawQr(host, text, force) {
    if (!host) return;
    if (host.firstChild && !force) return;
    try {
      var fn = window.qrcode || (typeof qrcode !== 'undefined' ? qrcode : null);
      if (!fn) return;
      var qr = fn(0, 'M');
      qr.addData(text);
      qr.make();
      host.innerHTML = qr.createSvgTag(4, 0);
      if (host.parentNode) host.parentNode.style.display = '';
    } catch (e) {
      // Без QR пункт живёт: остаются ссылка и код. Прячем вместе с подписью
      if (host.parentNode) host.parentNode.style.display = 'none';
    }
  }


  function hintSeen() {
    try { return localStorage.getItem(HINT_KEY) === '1'; } catch (e) { return false; }
  }

  function showMenu() {
    menu.hidden = false;
    tapHint.hidden = true;
    var tag = document.getElementById('m-engine-tag');
    if (tag && renderer) {
      var bName = renderer.backend && renderer.backend.isWebGLBackend ? 'WebGL2' : (renderer.backend && renderer.backend.isWebGPUBackend ? 'WebGPU' : 'Unknown');
      var glR = renderer.backend && renderer.backend.gl ? renderer.backend.gl.getParameter(renderer.backend.gl.RENDERER) : '';
      if (glR) glR = ' · ' + glR.replace(/ANGLE\s*\((.*?)\)/, '$1').slice(0, 32);
      tag.textContent = 'v1.4 · ' + bName + glR;
    }
  }

  function hideMenu() {
    showMainView();      // в следующий раз меню открывается с начала
    menu.hidden = true;
    // Подсказку возвращаем тому, кто ещё ни разу не вызвал меню сам: меню,
    // открывшееся само, о том, что его вызывают кликом, ничего не говорит.
    if (!hintSeen()) tapHint.hidden = false;
  }

  function toggleMenu() {
    menuUsed = true;
    try { localStorage.setItem(HINT_KEY, '1'); } catch (e) { /* приватный режим */ }
    if (menu.hidden) showMenu(); else hideMenu();
  }

  // Окно поверх меню (переименование, запрос пароля) живёт в конце body,
  // то есть вне карточки. Без этой проверки любое нажатие в нём — хоть
  // «Отмена», хоть «Сохранить» — заодно закрывало бы и само меню.
  function inModal(el) {
    return !!(el && el.closest && el.closest('.mdl-back'));
  }

  // Клик по сцене — переключатель. Внутри карточки у каждой кнопки своё дело,
  // а по затемнению вокруг неё меню закрывается.
  document.addEventListener('click', function (e) {
    if (menuCard.contains(e.target) || inModal(e.target)) return;
    toggleMenu();
  });

  addEventListener('keydown', function (e) {
    // Escape при открытом окне закрывает окно — меню под ним остаётся.
    // Окно к этому моменту уже убрано из документа, поэтому смотрим не на
    // него, а на признак «нажатие разобрали до нас».
    if (e.key === 'Escape' && !e.defaultPrevented && !menu.hidden) hideMenu();
  });

  document.getElementById('m-close').onclick = hideMenu;

  // ── выбор покупной рыбки ──
  // Раньше жил в админке, а смотреть, кого запускаешь, приходилось в другой
  // вкладке. Здесь набор открывается прямо поверх аквариума, и выбранная
  // рыбка появляется в кадре, не дожидаясь опроса.
  var menuMain = document.getElementById('menu-main');
  var menuPack = document.getElementById('menu-pack');
  var menuCapture = document.getElementById('menu-capture');
  var capFrame = document.getElementById('capframe');
  var menuBg = document.getElementById('menu-bg');
  var bgFrame = document.getElementById('bgframe');
  var menuFish = document.getElementById('menu-fish');
  // Имя с запасом: fishFrame в этом файле уже занят разбором геометрии рыбы.
  var fishListFrame = document.getElementById('fishframe');
  var menuPrint = document.getElementById('menu-print');
  var printFrame = document.getElementById('printframe');
  var menuShare = document.getElementById('menu-share');
  var menuDecor = document.getElementById('menu-decor');
  var packGrid = document.getElementById('packgrid');
  var packListed = false;

  // Виды карточки: главный список и то, что открывается из него. Прячем все
  // разом и показываем один — иначе с каждым новым видом забывается строка.
  var views = [menuMain, menuPack, menuCapture, menuBg, menuFish, menuPrint, menuShare, menuDecor];

  function showView(view, wide) {
    views.forEach(function (v) { v.hidden = v !== view; });
    menuCard.classList.toggle('wide', !!wide);
  }

  function showMainView() { showView(menuMain, false); }
  function showDecorView() { showView(menuDecor, false); }

  // Врезку заводим при первом открытии: пока её не позвали, страница не
  // грузится и не тянет свой three.js и свои картинки.
  function frameUp(frame, url) {
    if (!frame.src) frame.src = url;
    return frame;
  }

  // Съёмка, управление и раскраски — те же страницы, что и по своим адресам.
  // Второй такой же код внутри сцены начал бы расходиться с ними на первой
  // же правке. Сцена подхватит изменения опросом: фон за три секунды,
  // рыбки за пять.
  function showCaptureView() {
    showView(menuCapture, false);
    var f = frameUp(capFrame, Tank.url + '/capture?embed=1');
    // Врезка осталась на том экране, где её бросили: просим начать сначала.
    if (f.dataset.up && f.contentWindow) f.contentWindow.postMessage({ aqua: 'reset' }, location.origin);
    f.dataset.up = '1';
  }

  // Фон и удаление рыбок — разные пункты: первое меняют часто и без пароля,
  // второе необратимо и под паролем. Страница одна, но каждый раз показывает
  // только свою половину.
  function showBgView() {
    showView(menuBg, true);
    frameUp(bgFrame, Tank.url + '/admin?embed=1&only=bg');
  }

  function showFishView() {
    showView(menuFish, true);
    frameUp(fishListFrame, Tank.url + '/admin?embed=1&only=fish');
  }

  function showPrintView() {
    showView(menuPrint, true);
    frameUp(printFrame, '/print.html?embed=1');
  }

  function showPackView() {
    showView(menuPack, true);
    listPack();
  }

  // ── «Открыть на другом экране» ──
  // Весь перенос между устройствами собран в одном пункте: QR — телефону
  // с камерой, ссылка — мессенджеру, код — телевизору, где камеры нет.
  function showShareView() {
    showView(menuShare, false);
    var link = tankLink();
    drawQr(document.getElementById('share-qr'), link, true);
    var urlEl = document.getElementById('share-url');
    if (urlEl) urlEl.textContent = link;
    // Пин показываем свежим на каждое открытие: старый мог истечь, пока
    // меню лежало закрытым. Сервер всё равно вернёт живой тот же самый.
    document.getElementById('pinbox').hidden = true;
    pinBtn.hidden = false;
    pinBtn.querySelector('b').textContent = I18N.t('menu.share.pin');
  }


  // Код для телевизора: пять цифр вместо десяти знаков — их набирают пультом.
  // Выдаётся по нажатию, а не при открытии вида: пины из небольшого пула,
  // и жечь их на каждое «посмотреть меню» не стоит.
  var pinBtn = document.getElementById('m-tvpin');
  pinBtn.onclick = function () {
    pinBtn.disabled = true;
    fetch(Tank.api + '/pin', { method: 'POST' })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
      .then(function (d) {
        document.getElementById('pin-digits').textContent = d.pin;
        document.getElementById('pinbox').hidden = false;
        pinBtn.hidden = true;
      })
      .catch(function () {
        pinBtn.querySelector('b').textContent = I18N.t('menu.share.pin.fail');
      })
      .then(function () { pinBtn.disabled = false; });
  };

  var copyItem = document.getElementById('m-copylink');
  copyItem.onclick = function () {
    copyLink(function () {
      var b = copyItem.querySelector('b');
      b.textContent = I18N.t('menu.copied');
      setTimeout(function () { b.textContent = I18N.t('menu.share.copy'); }, 2000);
    });
  };

  // Системное «поделиться» есть не везде; где нет — кнопки просто нет.
  var sendItem = document.getElementById('m-sendlink');
  if (navigator.share) {
    sendItem.hidden = false;
    sendItem.onclick = function () {
      navigator.share({ title: tankName, url: tankLink() })
        .catch(function () { /* передумали — не ошибка */ });
    };
  }

  function addPackFish(name, btn) {
    btn.disabled = true;
    Tank.send(Tank.api + '/fish', { body: JSON.stringify({ type: 'pack', model: name }) })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (res.error) throw new Error(res.error);
        hideMenu();
        pollPainted();       // рыбка нужна сейчас, а не через пять секунд
      })
      .catch(function () {
        var t = btn.querySelector('.t');
        if (t) t.textContent = I18N.t('menu.picker.failed');
      })
      .then(function () { btn.disabled = false; });
  }

  // Названия видов берём из манифеста раскрасок: там они на трёх языках и
  // там же единственный список — в pack.json лежат только русские подписи.
  var sheetTitles = {};

  function packTitle(item) {
    var t = sheetTitles[item.name];
    return (t && (t[I18N.lang] || t.ru)) || item.title || item.name;
  }

  function listPack() {
    if (packListed) return;
    packListed = true;
    fetch('/assets/coloring/manifest.json')
      .then(function (r) { return r.json(); })
      .then(function (m) {
        (m.fish || []).forEach(function (f) { sheetTitles[f.name] = f.titles || { ru: f.title }; });
      })
      .catch(function () { /* останутся русские подписи из пака */ })
      .then(fillPack);
  }

  function fillPack() {
    FishThumbs.withPack(function (idx) {
      // Только виды с листом раскраски: набор и раскраски — один и тот же
      // зоопарк, иначе ребёнок видит в аквариуме рыбу, которую не раскрасить.
      var list = (idx.__list || []).filter(function (m) { return m.sheet; });
      packGrid.textContent = '';
      if (!list.length) {
        packGrid.innerHTML = '<p class="who">' + I18N.t('menu.picker.nopack') + '</p>';
        return;
      }
      list.forEach(function (item) {
        var b = document.createElement('button');
        b.className = 'packitem';
        b.type = 'button';
        b.innerHTML = '<span class="ph">' + I18N.t('menu.picker.drawing') + '</span><span class="t"></span>';
        b.querySelector('.t').textContent = packTitle(item);
        b.onclick = function () { addPackFish(item.name, b); };
        packGrid.appendChild(b);

        FishThumbs.get(item, function (url) {
          var slot = b.querySelector('.ph');
          if (!slot) return;
          if (!url) { slot.textContent = '🐠'; return; }
          var img = document.createElement('img');
          img.src = url;
          img.alt = '';
          slot.parentNode.replaceChild(img, slot);
        });
      });
    });
  }

  // Переименование. Имя — единственная настройка, которую правят, глядя на
  // сам аквариум, поэтому она здесь, а не в управлении. Пароль спрашиваем
  // только если правка вернулась отказом: на своём устройстве его уже знают.
  var tankName = I18N.t('tank.doctitle');

  function sendName(name) {
    return Tank.send(Tank.api + '/meta', { method: 'PATCH', body: JSON.stringify({ name: name }) });
  }

  function applyName(name) {
    tankName = name;
    document.getElementById('m-name').textContent = name;
    document.title = name;
  }

  document.getElementById('m-rename').onclick = function () {
    Modal.prompt({
      title: I18N.t('menu.rename.title'),
      text: I18N.t('menu.rename.text'),
      value: tankName,
      maxLength: 60,
      confirmLabel: I18N.t('menu.rename.ok')
    }).then(function (name) {
      if (name === null) return;
      name = name.trim();
      if (!name || name === tankName) return;

      var save = function (r) {
        if (r.ok) return r.json().then(function (m) { applyName(m.name); });
        if (r.status !== 401 && r.status !== 429) return;
        return Tank.askPass(Tank.id, { title: I18N.t('menu.pass.title') }).then(function (got) {
          if (!got) return;
          return sendName(name).then(function (r2) {
            if (r2.ok) return r2.json().then(function (m) { applyName(m.name); });
          });
        });
      };

      return sendName(name).then(save, function () {
        Modal.alert({ title: I18N.t('menu.rename.fail'), text: I18N.t('menu.fail.server') });
      });
    });
  };

  // ── доступ: код, ссылка, пароль ──
  // Всё про «кто и что может» собрано здесь, рядом с самим аквариумом:
  // код показывают гостям, пароль оставляют себе.
  var keyBtn = document.getElementById('m-key');
  var tankLocked = true;

  function renderKey() {
    keyBtn.classList.toggle('warn', !tankLocked);
    keyBtn.textContent = I18N.t(tankLocked ? 'menu.pass' : 'menu.pass.set');
  }

  function savePass(value) {
    return Tank.send(Tank.api + '/password', { body: JSON.stringify({ password: value }) });
  }

  function askNewPass(titleKey) {
    return Modal.prompt({
      title: I18N.t(titleKey),
      text: I18N.t('menu.newpass.text'),
      value: '', placeholder: I18N.t('menu.newpass.ph'), maxLength: 60, mono: true,
      confirmLabel: I18N.t('menu.rename.ok')
    }).then(function (value) {
      if (value === null) return;
      value = value.trim();
      if (value.length < 4) {
        return Modal.alert({
          title: I18N.t('menu.newpass.short.title'),
          text: I18N.t('menu.newpass.short.text')
        });
      }

      var saved = function (r) {
        if (!r.ok) return Modal.alert({ title: I18N.t('menu.fail.title'), text: I18N.t('menu.fail.pass') });
        Tank.setPass(Tank.id, value);
        tankLocked = true;
        renderKey();
        return Modal.alert({
          title: I18N.t('menu.newpass.saved.title'),
          text: I18N.t('menu.newpass.saved.text'),
          fields: [{ label: I18N.t('menu.newpass.saved.field'), value: value }],
          okLabel: I18N.t('menu.newpass.saved.ok')
        });
      };

      return savePass(value).then(function (r) {
        // Пароль меняет тот, кто знает старый: на чужом устройстве спросим.
        if (r.status !== 401 && r.status !== 429) return saved(r);
        return Tank.askPass(Tank.id, {
          title: I18N.t('menu.oldpass.title'),
          text: I18N.t('menu.oldpass.text')
        }).then(function (got) {
          if (!got) return;
          return savePass(value).then(saved);
        });
      }, function () {
        Modal.alert({ title: I18N.t('menu.fail.title'), text: I18N.t('menu.fail.server') });
      });
    });
  }

  function showAccess() {
    return Modal.confirm({
      title: I18N.t('menu.access.title'),
      text: I18N.t('menu.access.text'),
      fields: [
        { label: I18N.t('home.created.code'), value: Tank.id },
        { label: I18N.t('home.created.pass'), value: Tank.pass() || '—' }
      ],
      cancelLabel: I18N.t('menu.access.done'),
      confirmLabel: I18N.t('menu.access.change'),
      kind: 'go'
    }).then(function (change) {
      if (change) return askNewPass('menu.newpass.title');
    });
  }

  keyBtn.onclick = function () {
    if (!tankLocked) return askNewPass('menu.newpass.first');
    if (Tank.pass()) return showAccess();
    // Пароля на этом устройстве нет — сначала убедимся, что его знают.
    Tank.askPass(Tank.id, { title: I18N.t('menu.pass.title') })
      .then(function (got) { if (got) showAccess(); });
  };

  // Язык переключили — обновляем то, что собрано скриптом, а не разметкой.
  addEventListener('aqua:lang', function () {
    renderKey();
    setFishCount(fishCount || 0);
    packListed = false;
    packGrid.textContent = '';
    if (!menuPack.hidden) listPack();
  });

  document.getElementById('m-pack').onclick = showPackView;
  document.getElementById('m-packback').onclick = showMainView;
  document.getElementById('m-capture').onclick = showCaptureView;
  document.getElementById('m-capback').onclick = showMainView;
  document.getElementById('m-bg').onclick = showBgView;
  document.getElementById('m-bgback').onclick = showMainView;
  document.getElementById('m-fish').onclick = showFishView;
  document.getElementById('m-fishback').onclick = showMainView;
  document.getElementById('m-print').onclick = showPrintView;
  document.getElementById('m-printback').onclick = showMainView;
  document.getElementById('m-share').onclick = showShareView;
  document.getElementById('m-shareback').onclick = showMainView;
  document.getElementById('m-decor').onclick = showDecorView;
  document.getElementById('m-decorback').onclick = showMainView;

  // ── управление украшениями и эффектами (настройки производительности для ТВ и слабых GPU) ──
  var DECOR_KEY = 'aqua_decor_settings';
  var decorSwitches = document.querySelectorAll('#menu-decor .decor-switch');

  function getStoredDecorSettings() {
    try {
      var raw = localStorage.getItem(DECOR_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return null;
  }

  function applyDecor(key, enabled) {
    if (key === 'caustics') {
      caustics.value = enabled ? 1 : 0;
    }
    if (window.OceanFX && window.OceanFX.setDecorVisible) {
      window.OceanFX.setDecorVisible(key, enabled);
    }
  }

  function saveDecorSettings(settings) {
    try {
      localStorage.setItem(DECOR_KEY, JSON.stringify(settings));
    } catch (e) {}
  }

  function initDecorSettings() {
    var stored = getStoredDecorSettings() || {};
    var current = {};
    decorSwitches.forEach(function (sw) {
      var key = sw.dataset.decor;
      var enabled = typeof stored[key] === 'boolean' ? stored[key] : true;
      sw.checked = enabled;
      current[key] = enabled;
      applyDecor(key, enabled);

      sw.onchange = function () {
        var val = !!sw.checked;
        current[key] = val;
        applyDecor(key, val);
        saveDecorSettings(current);
      };
    });

    var allOnBtn = document.getElementById('m-decor-all-on');
    if (allOnBtn) {
      allOnBtn.onclick = function () {
        decorSwitches.forEach(function (sw) {
          sw.checked = true;
          current[sw.dataset.decor] = true;
          applyDecor(sw.dataset.decor, true);
        });
        saveDecorSettings(current);
      };
    }

    var allOffBtn = document.getElementById('m-decor-all-off');
    if (allOffBtn) {
      allOffBtn.onclick = function () {
        decorSwitches.forEach(function (sw) {
          sw.checked = false;
          current[sw.dataset.decor] = false;
          applyDecor(sw.dataset.decor, false);
        });
        saveDecorSettings(current);
      };
    }
  }

  // Врезка сообщает, что рыбку выпустили, — показываем её сразу.
  addEventListener('message', function (e) {
    if (e.origin !== location.origin || !e.data) return;
    if (e.data.aqua === 'fish-added') { pollPainted(); wantShot(2); }
    // Врезка сообщает свою высоту — карточка перестаёт быть с пустым низом.
    // Спрятанная врезка присылает ноль: её высоту не трогаем, иначе при
    // возврате карточка схлопнулась бы в полоску.
    if (e.data.aqua === 'height' && e.data.height > 80) {
      [capFrame, bgFrame, fishListFrame, printFrame].forEach(function (f) {
        if (e.source !== f.contentWindow) return;
        f.style.height = Math.min(e.data.height + 4, innerHeight * 0.78) + 'px';
      });
    }
  });

  // Корм сыплем сразу, не дожидаясь опроса настроек: ждать три секунды после
  // нажатия — это выглядит как «кнопка не работает». Серверу всё равно
  // сообщаем, чтобы корм увидели и на других открытых экранах.
  document.getElementById('m-feed').onclick = function () {
    hideMenu();
    feedNow();
    fetch(Tank.api + '/feed', { method: 'POST' })
      .then(function (r) { return r.json(); })
      .then(function (r) { seenFeedAt = r.feedAt; })   // уже покормили, по опросу не повторяем
      .catch(function () { /* без сервера корм всё равно упал */ });
  };

  function fishWord(n) {
    return n ? I18N.plural(n, 'fish') : I18N.t('tank.nofish');
  }

  // Пустой аквариум открывает меню сам — один раз и только если человек
  // до него не добрался раньше. Дальше меню только по клику.
  function setFishCount(n) {
    var first = fishCount === null;
    fishCount = n;
    document.getElementById('m-count').textContent = fishWord(n);
    if (first && !n && !menuUsed && !TV) showMenu();
    else if (first && !hintSeen()) tapHint.hidden = false;
  }

  function fail(html) {
    var l = document.getElementById('loading');
    if (l) { l.hidden = false; l.innerHTML = html; }
  }

  async function startScene() {
    try {
      await init();
    } catch (err) {
      fail(I18N.t('tank.crash', { msg: String(err && err.message || err) }));
    }
  }

  // Сначала убеждаемся, что аквариум вообще есть. Иначе сцена соберётся,
  // все запросы вернут 404, и человек будет смотреть в чёрный экран,
  // не понимая, что ссылка устарела или в коде опечатка.
  fetch(Tank.api + '/meta').then(function (r) {
    if (!r.ok) {
      Tank.forget(Tank.id);
      fail(I18N.t('tank.notank') +
           '<br><a href="/" style="color:#58d6ff">' + I18N.t('tank.tolist') + '</a>');
      return;
    }
    return r.json().then(function (meta) {
      applyName(meta.name);
      // Управление под паролем, и на чужом устройстве его не знают —
      // честнее предупредить до перехода, чем показать замок после.
      tankLocked = !!meta.locked;
      renderKey();
      if (meta.locked && !Tank.pass()) {
        document.querySelector('#m-fish i').textContent = I18N.t('menu.fish.sub.pass');
      }
      startScene();
    });
  }).catch(function () {
    fail(I18N.t('tank.noserver'));
  });
})();
</script>
</body>
</html>
